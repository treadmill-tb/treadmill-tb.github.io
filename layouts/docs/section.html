{{ define "body" }}
<div class="prose">{{ .Content }}</div>
{{ if ne .Path "/docs" }}
<div class="cards">
  {{ range .Pages.ByWeight }}
  <a class="card" href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong>{{ with .Description }}<span>{{ . | markdownify }}</span>{{ end }}</a>
  {{ end }}
</div>
{{ end }}
{{ end }}
{{ define "toc" }}
{{ partial "toc-list.html" (partial "h2-headings.html" .) }}
{{ end }}
